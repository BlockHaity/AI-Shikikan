# MCP 服务器配置 (mcp-servers.toml)
# 每个 [[servers]] 表对应一个 MCP 服务器, 支持三种传输方式:
#   transport - "stdio"(默认, 子进程) | "http"(Streamable HTTP) | "sse"(HTTP+Server-Sent Events)
#   id        - 唯一标识, 工具名前缀 mcp_<id>_
#   name      - 显示名称
#   url       - http/sse 传输的服务器地址(stdio 时忽略)
#   command   - stdio 传输的启动命令(npx / uvx / node / python 等)
#   args      - stdio 传输的命令参数数组
#   env       - stdio 传输的额外环境变量表(与父进程环境合并)
#   enabled   - 是否启用(默认 true)

[[servers]]
id = "filesystem"
name = "文件系统"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "/home/user/docs"]
enabled = false

[[servers]]
id = "fetch"
name = "网页抓取"
command = "uvx"
args = ["mcp-server-fetch"]
enabled = false

[[servers]]
id = "context7"
name = "Context7 (Streamable HTTP)"
transport = "http"
url = "https://mcp.context7.com/mcp"
enabled = false

[[servers]]
id = "deepwiki"
name = "DeepWiki (SSE)"
transport = "sse"
url = "https://mcp.deepwiki.com/sse"
enabled = false
