# 自定义 Agent 定义 + 分派规则模板
# 首次启动时会自动生成默认 agents.toml, 此文件仅为参考示例
# 参数通过 args 模板传入, 支持 {prompt} 占位符
# plan_args 为主对话 Plan 模式下允许该 Agent 时追加的参数(为空表示不支持 Plan 模式)
# 用户定义按 id 覆盖或作为独立条目

rules = "优先选择专长与任务匹配的 Agent; 涉及多个领域时先拆分子任务再分配。"

[[agents]]
id = "claude"
name = "Claude Code"
executable = "claude"
args = ["-p", "{prompt}"]
plan_args = ["--permission-mode", "plan"]
default_mode = "sync"
max_concurrent = 1
require_approval = true
timeout_minutes = 30
description = "Anthropic 官方编码 Agent, 擅长代码实现/重构/测试"
recommended_persona_id = "general-expert"

[[agents]]
id = "codex"
name = "Codex CLI"
executable = "codex"
args = ["exec", "{prompt}"]
default_mode = "sync"
max_concurrent = 1
require_approval = true
timeout_minutes = 30
description = "OpenAI 官方 CLI 编码 Agent, 擅长精确的小步修改"
recommended_persona_id = "general-expert"

[[agents]]
id = "gemini"
name = "Gemini CLI"
executable = "gemini"
args = ["-p", "{prompt}"]
default_mode = "sync"
max_concurrent = 1
require_approval = true
timeout_minutes = 30
description = "Google 官方命令行 Agent, 支持联网与多模态, 适合研究与搜索"

[[agents]]
id = "opencode"
name = "OpenCode"
executable = "opencode"
args = ["run", "{prompt}"]
default_mode = "sync"
max_concurrent = 1
require_approval = true
timeout_minutes = 30
description = "开源通用命令行 Agent, 插件生态丰富"

[[agents]]
id = "reasonix"
name = "Reasonix"
executable = "reasonix"
args = ["run", "{prompt}"]
default_mode = "sync"
max_concurrent = 1
require_approval = true
timeout_minutes = 30
description = "DeepSeek 原生缓存优先 Agent, 低成本批量/长任务"

[[agents]]
id = "my-codex"
name = "我的 Codex"
executable = "codex"
args = ["exec", "{prompt}"]
default_mode = "sync"
max_concurrent = 1
require_approval = true
timeout_minutes = 30
description = "基于 codex 的自定义 Agent 示例"