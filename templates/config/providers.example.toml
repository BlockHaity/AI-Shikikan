# LLM Provider 配置模板
# kind: "OpenAi"(OpenAI 兼容, 含 DeepSeek 等) / "Anthropic"
# apiKey 留空时读取环境变量 OPENAI_API_KEY / ANTHROPIC_API_KEY

active_provider_id = "openai"
[[providers]]
id = "openai"
name = "OpenAI"
kind = "OpenAi"
base_url = "https://api.openai.com/v1"
api_key = ""
default_model = "gpt-4o"
[[providers]]
id = "anthropic"
name = "Anthropic"
kind = "Anthropic"
base_url = "https://api.anthropic.com"
api_key = ""
default_model = "claude-sonnet-4-20250514"
[[providers]]
id = "deepseek"
name = "DeepSeek"
kind = "OpenAi"
base_url = "https://api.deepseek.com/v1"
api_key = ""
default_model = "deepseek-chat"
