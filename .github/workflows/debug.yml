# Debug 构建工作流 (仅手动触发: Actions 页面 Run workflow)
name: Debug Build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: '构建配置'
        type: choice
        options:
          - Debug
          - Release
        default: Debug
      aot:
        description: '额外测试 Native AOT 构建 (AOT 文件名带 AOT 标识)'
        type: boolean
        default: false
      skip-if-released:
        description: '如果 v<version> 标签已存在则跳过构建'
        type: boolean
        default: false

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      run_build: ${{ steps.decide.outputs.run_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version from VERSION file
        id: read
        run: |
          FILE_VERSION="$(cat VERSION 2>/dev/null | tr -d '[:space:]')"
          if [ -z "$FILE_VERSION" ]; then
            FILE_VERSION="1.0.0-vibe"
            echo "::warning::VERSION file missing or empty, falling back to 1.0.0-vibe"
          fi
          echo "version=${FILE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Decide whether to build
        id: decide
        run: |
          TAG="v${{ steps.read.outputs.version }}"
          if [ "${{ inputs.skip-if-released }}" = "true" ] && \
             git ls-remote --exit-code --tags origin "$TAG" > /dev/null 2>&1; then
            RUN=false; REASON="tag $TAG already exists (skip-if-released)"
          else
            RUN=true; REASON="proceed"
          fi
          echo "run_build=${RUN}" >> "$GITHUB_OUTPUT"
          echo "reason=${REASON}" >> "$GITHUB_OUTPUT"
          {
            echo "## Version check"
            echo ""
            echo "- Version: \`${{ steps.read.outputs.version }}\` (from VERSION file)"
            echo "- Tag: \`${TAG}\`"
            echo "- Build: **${RUN}** — ${REASON}"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.rid }}
    needs: check
    if: needs.check.outputs.run_build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            ext: tar.gz
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            ext: tar.gz
          - os: windows-latest
            rid: win-x64
            ext: zip
          - os: windows-11-vs2026-arm
            rid: win-arm64
            ext: zip
          - os: macos-15-intel
            rid: osx-x64
            ext: tar.gz
          - os: macos-15
            rid: osx-arm64
            ext: tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Install Linux AOT toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Install Linux packaging tools
        if: startsWith(matrix.rid, 'linux')
        run: |
          sudo apt-get install -y rpm zstd imagemagick

      - name: Publish regular dotnet (framework-dependent)
        shell: bash
        run: |
          dotnet publish src/AIShikikan.Gui/AIShikikan.Gui.csproj \
            -c ${{ inputs.configuration }} -r ${{ matrix.rid }} --self-contained false \
            -p:PublishAot=false -o stage/dotnet

      - name: Publish self-contained (with .NET runtime)
        shell: bash
        run: |
          dotnet publish src/AIShikikan.Gui/AIShikikan.Gui.csproj \
            -c ${{ inputs.configuration }} -r ${{ matrix.rid }} --self-contained true \
            -p:PublishAot=false -p:PublishSingleFile=true \
            -p:PublishTrimmed=true -p:TrimMode=partial \
            -p:IncludeNativeLibrariesForSelfExtract=true -o stage/selfcontained

      - name: Publish Native AOT (test)
        if: inputs.aot
        shell: bash
        run: |
          dotnet publish src/AIShikikan.Gui/AIShikikan.Gui.csproj \
            -c ${{ inputs.configuration }} -r ${{ matrix.rid }} --self-contained true \
            -p:PublishAot=true -p:PublishSingleFile=true -p:StripSymbols=true \
            -o stage/aot

      - name: Build Linux packages (deb / rpm / pacman)
        if: startsWith(matrix.rid, 'linux')
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
          RID: ${{ matrix.rid }}
          VARIANTS: ${{ inputs.aot && 'dotnet selfcontained aot' || 'dotnet selfcontained' }}
          HOMEPAGE: ${{ github.server_url }}/${{ github.repository }}
          MAINTAINER: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
        run: ./Packagers/linux/package.sh

      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          chmod +x stage/*/AIShikikan.Gui 2>/dev/null || true
          # 排除调试符号 (*.pdb / *.dbg), AOT 变体的 .dbg 体积可与主程序相当
          tar czf dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-${{ inputs.configuration }}-dotnet.tar.gz --exclude='*.pdb' --exclude='*.dbg' -C stage/dotnet .
          tar czf dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-${{ inputs.configuration }}-selfcontained.tar.gz --exclude='*.pdb' --exclude='*.dbg' -C stage/selfcontained .
          if [ "${{ inputs.aot }}" = "true" ]; then
            tar czf dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-${{ inputs.configuration }}-AOT.tar.gz --exclude='*.pdb' --exclude='*.dbg' -C stage/aot .
          fi

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          # 排除调试符号 (*.pdb / *.dbg), 与 build.sh 打包口径一致。
          # Compress-Archive 不支持 -Exclude, 这里先把 stage 里的符号文件清掉
          Get-ChildItem -Path stage -Recurse -File |
            Where-Object { $_.Name -like '*.pdb' -or $_.Name -like '*.dbg' } |
            Remove-Item -Force
          Compress-Archive -Path stage/dotnet/* -DestinationPath dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-${{ inputs.configuration }}-dotnet.zip
          Compress-Archive -Path stage/selfcontained/* -DestinationPath dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-${{ inputs.configuration }}-selfcontained.zip
          if ('${{ inputs.aot }}' -eq 'true') {
            Compress-Archive -Path stage/aot/* -DestinationPath dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-${{ inputs.configuration }}-AOT.zip
          }

      - name: Upload dotnet artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.rid }}-${{ inputs.configuration }}-dotnet
          path: dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-${{ inputs.configuration }}-dotnet.*
          if-no-files-found: error

      - name: Upload selfcontained artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.rid }}-${{ inputs.configuration }}-selfcontained
          path: dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-${{ inputs.configuration }}-selfcontained.*
          if-no-files-found: error

      - name: Upload AOT artifact
        if: inputs.aot
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.rid }}-${{ inputs.configuration }}-AOT
          path: dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-${{ inputs.configuration }}-AOT.*
          if-no-files-found: error

      - name: Upload Linux dotnet deb
        if: startsWith(matrix.rid, 'linux')
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.rid }}-${{ inputs.configuration }}-dotnet-deb
          path: dist/*_dotnet.deb
          if-no-files-found: error

      - name: Upload Linux dotnet rpm
        if: startsWith(matrix.rid, 'linux')
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.rid }}-${{ inputs.configuration }}-dotnet-rpm
          path: dist/*_dotnet.rpm
          if-no-files-found: error

      - name: Upload Linux dotnet pacman
        if: startsWith(matrix.rid, 'linux')
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.rid }}-${{ inputs.configuration }}-dotnet-pacman
          path: dist/*_dotnet.pkg.tar.zst
          if-no-files-found: error

      - name: Upload Linux selfcontained deb
        if: startsWith(matrix.rid, 'linux')
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.rid }}-${{ inputs.configuration }}-selfcontained-deb
          path: dist/*_selfcontained.deb
          if-no-files-found: error

      - name: Upload Linux selfcontained rpm
        if: startsWith(matrix.rid, 'linux')
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.rid }}-${{ inputs.configuration }}-selfcontained-rpm
          path: dist/*_selfcontained.rpm
          if-no-files-found: error

      - name: Upload Linux selfcontained pacman
        if: startsWith(matrix.rid, 'linux')
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.rid }}-${{ inputs.configuration }}-selfcontained-pacman
          path: dist/*_selfcontained.pkg.tar.zst
          if-no-files-found: error

      - name: Upload Linux aot deb
        if: startsWith(matrix.rid, 'linux') && inputs.aot
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.rid }}-${{ inputs.configuration }}-aot-deb
          path: dist/*_aot.deb
          if-no-files-found: error

      - name: Upload Linux aot rpm
        if: startsWith(matrix.rid, 'linux') && inputs.aot
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.rid }}-${{ inputs.configuration }}-aot-rpm
          path: dist/*_aot.rpm
          if-no-files-found: error

      - name: Upload Linux aot pacman
        if: startsWith(matrix.rid, 'linux') && inputs.aot
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.rid }}-${{ inputs.configuration }}-aot-pacman
          path: dist/*_aot.pkg.tar.zst
          if-no-files-found: error