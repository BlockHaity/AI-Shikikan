# Debug 构建工作流 (仅手动触发: Actions 页面 Run workflow)
name: Debug Build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: '构建配置'
        type: choice
        options:
          - Debug
          - Release
        default: Debug
      aot:
        description: '额外测试 Native AOT 构建 (AOT 文件名带 AOT 标识)'
        type: boolean
        default: false
      skip-if-released:
        description: '如果 v<version> 标签已存在则跳过构建'
        type: boolean
        default: false

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      run_build: ${{ steps.decide.outputs.run_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version from VERSION file
        id: read
        run: |
          FILE_VERSION="$(cat VERSION 2>/dev/null | tr -d '[:space:]')"
          if [ -z "$FILE_VERSION" ]; then
            FILE_VERSION="0.9.0-vibe"
            echo "::warning::VERSION file missing or empty, falling back to 0.9.0-vibe"
          fi
          echo "version=${FILE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Decide whether to build
        id: decide
        run: |
          TAG="v${{ steps.read.outputs.version }}"
          if [ "${{ inputs.skip-if-released }}" = "true" ] && \
             git ls-remote --exit-code --tags origin "$TAG" > /dev/null 2>&1; then
            RUN=false; REASON="tag $TAG already exists (skip-if-released)"
          else
            RUN=true; REASON="proceed"
          fi
          echo "run_build=${RUN}" >> "$GITHUB_OUTPUT"
          echo "reason=${REASON}" >> "$GITHUB_OUTPUT"
          {
            echo "## Version check"
            echo ""
            echo "- Version: \`${{ steps.read.outputs.version }}\` (from VERSION file)"
            echo "- Tag: \`${TAG}\`"
            echo "- Build: **${RUN}** — ${REASON}"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.rid }}
    needs: check
    if: needs.check.outputs.run_build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            ext: tar.gz
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            ext: tar.gz
          - os: windows-latest
            rid: win-x64
            ext: zip
          - os: windows-11-vs2026-arm
            rid: win-arm64
            ext: zip
          - os: macos-15-intel
            rid: osx-x64
            ext: tar.gz
          - os: macos-15
            rid: osx-arm64
            ext: tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Install Linux AOT toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Install Linux packaging tools
        if: startsWith(matrix.rid, 'linux')
        run: |
          sudo apt-get install -y rpm zstd imagemagick

      - name: Publish regular dotnet (framework-dependent)
        shell: bash
        run: |
          dotnet publish AIShikikan.Gui.csproj \
            -c ${{ inputs.configuration }} -r ${{ matrix.rid }} --self-contained false \
            -p:PublishAot=false -o stage/dotnet

      - name: Publish self-contained (with .NET runtime)
        shell: bash
        run: |
          dotnet publish AIShikikan.Gui.csproj \
            -c ${{ inputs.configuration }} -r ${{ matrix.rid }} --self-contained true \
            -p:PublishAot=false -p:PublishSingleFile=true \
            -p:PublishTrimmed=true -p:TrimMode=partial \
            -p:IncludeNativeLibrariesForSelfExtract=true -o stage/selfcontained

      - name: Publish Native AOT (test)
        if: inputs.aot
        shell: bash
        run: |
          dotnet publish AIShikikan.Gui.csproj \
            -c ${{ inputs.configuration }} -r ${{ matrix.rid }} --self-contained true \
            -p:PublishAot=true -p:PublishSingleFile=true -p:StripSymbols=true \
            -o stage/aot

      - name: Build Linux packages (deb / rpm / pacman)
        if: startsWith(matrix.rid, 'linux')
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
          RID: ${{ matrix.rid }}
          AOT_ENABLED: ${{ inputs.aot }}
          HOMEPAGE: ${{ github.server_url }}/${{ github.repository }}
          MAINTAINER: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
        run: |
          set -euo pipefail
          case "$RID" in
            linux-x64)   DEB_ARCH=amd64;  PKG_ARCH=x86_64 ;;
            linux-arm64) DEB_ARCH=arm64;  PKG_ARCH=aarch64 ;;
            *) echo "unexpected rid $RID"; exit 1 ;;
          esac
          PKG=ai-shikikan
          # deb: Debian Version 只允许 [0-9A-Za-z.+~-], 下划线非法;
          #      '-' -> '~' 是预发布惯例, 保证 0.9.0~vibe 排序在 0.9.0 之前
          # 注意: bash 会把替换串里的裸 '~' 做 tilde 展开成 $HOME, 需转义成 '\~'
          DEB_VER="${VERSION//-/\~}"
          # rpm/pacman: Version 允许下划线 ('-' 才是分隔符), 用 '_' 替换 '-'
          PVER="${VERSION//-/_}"
          # 防御性校验: 任何异常的展开都会在此暴露实值, 而非 dpkg 的晦涩报错
          [[ "$DEB_VER" =~ ^[0-9A-Za-z.+~:-]+$ ]] || { echo "非法 DEB_VER='$DEB_VER' (VERSION='$VERSION')"; exit 1; }
          [[ "$PVER" =~ ^[0-9A-Za-z._+]+$ ]] || { echo "非法 PVER='$PVER' (VERSION='$VERSION')"; exit 1; }
          DESC="AI-Shikikan is an Agent commander: it orchestrates terminal agents such as Claude Code, OpenCode, Codex CLI and Gemini CLI to complete complex tasks."
          mkdir -p dist
          convert Assets/logo.jpg -resize 256x256 "$RUNNER_TEMP/ai-shikikan.png"
          cp packagers/ai-shikikan.desktop "$RUNNER_TEMP/$PKG.desktop"
          ROOT="$PWD"

          # 变体集合: dotnet/selfcontained 恒有, aot 仅在启用 AOT 构建时存在
          VARIANTS="dotnet selfcontained"
          [ "$AOT_ENABLED" = "true" ] && VARIANTS="$VARIANTS aot"

          for VARIANT in $VARIANTS; do
          echo "== 打包变体 $VARIANT =="
          case "$VARIANT" in
            dotnet)        BIN="$ROOT/stage/dotnet/AIShikikan.Gui" ;;
            selfcontained) BIN="$ROOT/stage/selfcontained/AIShikikan.Gui" ;;
            aot)           BIN="$ROOT/stage/aot/AIShikikan.Gui" ;;
            *) echo "unexpected variant $VARIANT"; exit 1 ;;
          esac
          [ -f "$BIN" ] || { echo "缺少二进制 $BIN"; exit 1; }
          # 注意: dotnet 变体为框架依赖发布, 此处仅做打包链路校验
          chmod +x "$BIN"
          BINDIR=$(dirname "$BIN")
          # 原生共享库 (libSkiaSharp/libHarfBuzzSharp 等) 必须与可执行文件同目录:
          # 运行时 dlopen 动态引用按 应用目录 -> 系统库路径 探测, AOT /
          # framework-dependent 发布不会内嵌这些 .so; selfcontained 因
          # IncludeNativeLibrariesForSelfExtract 已内嵌, glob 为空自动跳过

          # ---------- Debian (.deb) ----------
          DEBROOT="$RUNNER_TEMP/debroot_$VARIANT"
          install -Dm755 "$BIN" "$DEBROOT/usr/lib/$PKG/AIShikikan.Gui"
          for _so in "$BINDIR"/*.so; do
            [ -e "$_so" ] || continue
            install -Dm755 "$_so" "$DEBROOT/usr/lib/$PKG/"
          done
          mkdir -p "$DEBROOT/usr/bin"
          ln -sf "/usr/lib/$PKG/AIShikikan.Gui" "$DEBROOT/usr/bin/$PKG"
          install -Dm644 "$RUNNER_TEMP/$PKG.desktop" "$DEBROOT/usr/share/applications/$PKG.desktop"
          install -Dm644 "$RUNNER_TEMP/ai-shikikan.png" "$DEBROOT/usr/share/icons/hicolor/256x256/apps/$PKG.png"
          install -Dm644 LICENSE "$DEBROOT/usr/share/doc/$PKG/copyright"
          SIZE=$(du -sk "$DEBROOT" | cut -f1)
          mkdir -p "$DEBROOT/DEBIAN"
          sed -e "s|@VERSION@|$DEB_VER|g" \
              -e "s|@ARCH@|$DEB_ARCH|g" \
              -e "s|@MAINTAINER@|$MAINTAINER|g" \
              -e "s|@SIZE@|$SIZE|g" \
              -e "s|@HOMEPAGE@|$HOMEPAGE|g" \
              -e "s|@DESC@|$DESC|g" \
              packagers/deb/control > "$DEBROOT/DEBIAN/control"
          # dpkg 要求 Description 多行字段以换行终止, 缺尾换行会报 missing final newline
          [ -z "$(tail -c1 "$DEBROOT/DEBIAN/control")" ] || printf '\n' >> "$DEBROOT/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$DEBROOT" "dist/${PKG}_${DEB_VER}_${DEB_ARCH}_${VARIANT}.deb"

          # ---------- Red Hat (.rpm / dnf) ----------
          mkdir -p "$HOME/rpmbuild"/{BUILD,RPMS,SPECS,SOURCES,SRPMS}
          rm -rf "$HOME/rpmbuild"/RPMS/*
          sed -e "s|@VERSION@|$PVER|g" \
              -e "s|@HOMEPAGE@|$HOMEPAGE|g" \
              -e "s|@DESC@|$DESC|g" \
              -e "s|@BIN@|$BIN|g" \
              -e "s|@BINDIR@|$BINDIR|g" \
              -e "s|@DESKTOP@|$RUNNER_TEMP/$PKG.desktop|g" \
              -e "s|@ICON@|$RUNNER_TEMP/ai-shikikan.png|g" \
              -e "s|@LICENSE@|$ROOT/LICENSE|g" \
              packagers/rpm/ai-shikikan.spec > "$HOME/rpmbuild/SPECS/$PKG.spec"
          rpmbuild -bb --target "$PKG_ARCH" "$HOME/rpmbuild/SPECS/$PKG.spec"
          for _r in "$HOME"/rpmbuild/RPMS/*/*.rpm; do
            [ -e "$_r" ] || continue
            mv -f "$_r" "${_r%.rpm}_${VARIANT}.rpm"
            cp -f "${_r%.rpm}_${VARIANT}.rpm" dist/
          done

          # ---------- Arch Linux (.pkg.tar.zst) ----------
          PKGROOT="$RUNNER_TEMP/pkgroot_$VARIANT"
          install -Dm755 "$BIN" "$PKGROOT/usr/lib/$PKG/AIShikikan.Gui"
          for _so in "$BINDIR"/*.so; do
            [ -e "$_so" ] || continue
            install -Dm755 "$_so" "$PKGROOT/usr/lib/$PKG/"
          done
          mkdir -p "$PKGROOT/usr/bin"
          ln -sf "/usr/lib/$PKG/AIShikikan.Gui" "$PKGROOT/usr/bin/$PKG"
          install -Dm644 "$RUNNER_TEMP/$PKG.desktop" "$PKGROOT/usr/share/applications/$PKG.desktop"
          install -Dm644 "$RUNNER_TEMP/ai-shikikan.png" "$PKGROOT/usr/share/icons/hicolor/256x256/apps/$PKG.png"
          install -Dm644 LICENSE "$PKGROOT/usr/share/licenses/$PKG/LICENSE"
          PKGSIZE=$(du -sb "$PKGROOT" | cut -f1)
          cat > "$PKGROOT/.PKGINFO" <<EOF
          # Generated by debug.yml
          pkgname = $PKG
          pkgver = $PVER-1
          pkgdesc = AI Agent commander desktop app
          url = $HOMEPAGE
          builddate = $(date +%s)
          packager = GitHub Actions
          size = $PKGSIZE
          arch = $PKG_ARCH
          license = MIT
          depend = libx11
          depend = libxcursor
          depend = libxrandr
          depend = libxrender
          depend = libglvnd
          depend = mesa
          depend = fontconfig
          depend = glib2
          depend = icu
          EOF
          tar --zstd -cf "dist/${PKG}-${PVER}-1-${PKG_ARCH}_${VARIANT}.pkg.tar.zst" \
            -C "$PKGROOT" .PKGINFO usr
          done

          ls -lh dist/

      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          chmod +x stage/*/AIShikikan.Gui 2>/dev/null || true
          tar czf dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-${{ inputs.configuration }}-dotnet.tar.gz -C stage/dotnet .
          tar czf dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-${{ inputs.configuration }}-selfcontained.tar.gz -C stage/selfcontained .
          if [ "${{ inputs.aot }}" = "true" ]; then
            tar czf dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-${{ inputs.configuration }}-AOT.tar.gz -C stage/aot .
          fi

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path stage/dotnet/* -DestinationPath dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-${{ inputs.configuration }}-dotnet.zip
          Compress-Archive -Path stage/selfcontained/* -DestinationPath dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-${{ inputs.configuration }}-selfcontained.zip
          if ('${{ inputs.aot }}' -eq 'true') {
            Compress-Archive -Path stage/aot/* -DestinationPath dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-${{ inputs.configuration }}-AOT.zip
          }

      - name: Upload dotnet artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.rid }}-${{ inputs.configuration }}-dotnet
          path: dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-${{ inputs.configuration }}-dotnet.*
          if-no-files-found: error

      - name: Upload selfcontained artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.rid }}-${{ inputs.configuration }}-selfcontained
          path: dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-${{ inputs.configuration }}-selfcontained.*
          if-no-files-found: error

      - name: Upload AOT artifact
        if: inputs.aot
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.rid }}-${{ inputs.configuration }}-AOT
          path: dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-${{ inputs.configuration }}-AOT.*
          if-no-files-found: error

      - name: Upload Linux dotnet deb
        if: startsWith(matrix.rid, 'linux')
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.rid }}-${{ inputs.configuration }}-dotnet-deb
          path: dist/*_dotnet.deb
          if-no-files-found: error

      - name: Upload Linux dotnet rpm
        if: startsWith(matrix.rid, 'linux')
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.rid }}-${{ inputs.configuration }}-dotnet-rpm
          path: dist/*_dotnet.rpm
          if-no-files-found: error

      - name: Upload Linux dotnet pacman
        if: startsWith(matrix.rid, 'linux')
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.rid }}-${{ inputs.configuration }}-dotnet-pacman
          path: dist/*_dotnet.pkg.tar.zst
          if-no-files-found: error

      - name: Upload Linux selfcontained deb
        if: startsWith(matrix.rid, 'linux')
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.rid }}-${{ inputs.configuration }}-selfcontained-deb
          path: dist/*_selfcontained.deb
          if-no-files-found: error

      - name: Upload Linux selfcontained rpm
        if: startsWith(matrix.rid, 'linux')
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.rid }}-${{ inputs.configuration }}-selfcontained-rpm
          path: dist/*_selfcontained.rpm
          if-no-files-found: error

      - name: Upload Linux selfcontained pacman
        if: startsWith(matrix.rid, 'linux')
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.rid }}-${{ inputs.configuration }}-selfcontained-pacman
          path: dist/*_selfcontained.pkg.tar.zst
          if-no-files-found: error

      - name: Upload Linux aot deb
        if: startsWith(matrix.rid, 'linux') && inputs.aot
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.rid }}-${{ inputs.configuration }}-aot-deb
          path: dist/*_aot.deb
          if-no-files-found: error

      - name: Upload Linux aot rpm
        if: startsWith(matrix.rid, 'linux') && inputs.aot
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.rid }}-${{ inputs.configuration }}-aot-rpm
          path: dist/*_aot.rpm
          if-no-files-found: error

      - name: Upload Linux aot pacman
        if: startsWith(matrix.rid, 'linux') && inputs.aot
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.rid }}-${{ inputs.configuration }}-aot-pacman
          path: dist/*_aot.pkg.tar.zst
          if-no-files-found: error