name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (如 1.0.0)'
        required: true
        default: '1.0.0'
      prerelease:
        description: '标记为预发布 (Pre-release)'
        type: boolean
        default: false
      draft:
        description: '先创建为草稿 (Draft)'
        type: boolean
        default: false

env:
  DOTNET_VERSION: '10.0.x'
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            ext: tar.gz
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            ext: tar.gz
          - os: windows-latest
            rid: win-x64
            ext: zip
          - os: macos-15-intel
            rid: osx-x64
            ext: tar.gz
          - os: macos-15
            rid: osx-arm64
            ext: tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Install Linux AOT toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish AOT (Native AOT, CLI + GUI)
        shell: bash
        run: |
          dotnet publish src/AIShikikan.Cli/AIShikikan.Cli.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishAot=true -p:PublishSingleFile=true -p:StripSymbols=true \
            -p:Version=${{ env.RELEASE_VERSION }} -o stage/aot
          dotnet publish src/AIShikikan.Gui/AIShikikan.Gui.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishAot=true -p:PublishSingleFile=true \
            -p:Version=${{ env.RELEASE_VERSION }} -o stage/aot

      - name: Publish regular dotnet (framework-dependent)
        shell: bash
        run: |
          dotnet publish src/AIShikikan.Cli/AIShikikan.Cli.csproj \
            -c Release -r ${{ matrix.rid }} \
            -p:PublishAot=false \
            -p:Version=${{ env.RELEASE_VERSION }} -o stage/dotnet
          dotnet publish src/AIShikikan.Gui/AIShikikan.Gui.csproj \
            -c Release -r ${{ matrix.rid }} \
            -p:PublishAot=false \
            -p:Version=${{ env.RELEASE_VERSION }} -o stage/dotnet

      - name: Publish self-contained (with .NET runtime)
        shell: bash
        run: |
          dotnet publish src/AIShikikan.Cli/AIShikikan.Cli.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishAot=false -p:PublishSingleFile=true \
            -p:PublishTrimmed=true -p:TrimMode=partial \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=${{ env.RELEASE_VERSION }} -o stage/selfcontained
          dotnet publish src/AIShikikan.Gui/AIShikikan.Gui.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishAot=false -p:PublishSingleFile=true \
            -p:PublishTrimmed=false -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=${{ env.RELEASE_VERSION }} -o stage/selfcontained

      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          chmod +x stage/*/AIShikikan.Cli stage/*/AIShikikan.Gui 2>/dev/null || true
          tar czf dist/AIShikikan-${{ env.RELEASE_VERSION }}-${{ matrix.rid }}-AOT.tar.gz -C stage/aot .
          tar czf dist/AIShikikan-${{ env.RELEASE_VERSION }}-${{ matrix.rid }}-dotnet.tar.gz -C stage/dotnet .
          tar czf dist/AIShikikan-${{ env.RELEASE_VERSION }}-${{ matrix.rid }}-selfcontained.tar.gz -C stage/selfcontained .

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path stage/aot/* -DestinationPath dist/AIShikikan-${{ env.RELEASE_VERSION }}-${{ matrix.rid }}-AOT.zip
          Compress-Archive -Path stage/dotnet/* -DestinationPath dist/AIShikikan-${{ env.RELEASE_VERSION }}-${{ matrix.rid }}-dotnet.zip
          Compress-Archive -Path stage/selfcontained/* -DestinationPath dist/AIShikikan-${{ env.RELEASE_VERSION }}-${{ matrix.rid }}-selfcontained.zip

      - name: Upload to build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: List downloaded files
        run: find artifacts -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: v${{ env.RELEASE_VERSION }}
          body: |
            AI-Shikikan v${{ env.RELEASE_VERSION }} 发布

            包含三种构建版本 (每平台):
            - **AOT**: Native AOT 编译, 无需 .NET 运行时, 启动最快
            - **dotnet**: 常规发布, 需要安装 .NET 10 运行时
            - **selfcontained**: 自带 .NET 运行时, 开箱即用
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
