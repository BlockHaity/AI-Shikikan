# Release 发布工作流 (仅手动触发: Actions 页面 Run workflow)
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '覆盖版本号 (留空则读取根目录 VERSION 文件)'
        required: false
        default: ''
      prerelease:
        description: '标记为预发布 (Pre-release)'
        type: boolean
        default: false
      draft:
        description: '先创建为草稿 (Draft)'
        type: boolean
        default: false
      force:
        description: '强制重新构建 (即使 v<version> 标签已存在)'
        type: boolean
        default: false

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      run_build: ${{ steps.decide.outputs.run_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version from VERSION file
        id: read
        run: |
          FILE_VERSION="$(cat VERSION 2>/dev/null | tr -d '[:space:]')"
          if [ -z "$FILE_VERSION" ]; then
            FILE_VERSION="0.9.0"
            echo "::warning::VERSION file missing or empty, falling back to 0.9.0"
          fi
          if [ -z "${{ inputs.version }}" ]; then
            echo "version=${FILE_VERSION}" >> "$GITHUB_OUTPUT"
            echo "source=VERSION file" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "source=manual input" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to build
        id: decide
        run: |
          TAG="v${{ steps.read.outputs.version }}"
          if [ "${{ inputs.force }}" = "true" ]; then
            RUN=true; REASON="force input"
          elif git ls-remote --exit-code --tags origin "$TAG" > /dev/null 2>&1; then
            RUN=false; REASON="tag $TAG already exists"
          else
            RUN=true; REASON="tag $TAG not found"
          fi
          echo "run_build=${RUN}" >> "$GITHUB_OUTPUT"
          echo "reason=${REASON}" >> "$GITHUB_OUTPUT"
          {
            echo "## Version check"
            echo ""
            echo "- Version: \`${{ steps.read.outputs.version }}\` (from: ${{ steps.read.outputs.source }})"
            echo "- Tag: \`${TAG}\`"
            echo "- Build: **${RUN}** — ${REASON}"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.rid }}
    needs: check
    if: needs.check.outputs.run_build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            ext: tar.gz
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            ext: tar.gz
          - os: windows-latest
            rid: win-x64
            ext: zip
          - os: macos-15-intel
            rid: osx-x64
            ext: tar.gz
          - os: macos-15
            rid: osx-arm64
            ext: tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Install Linux AOT toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Install Linux packaging tools
        if: startsWith(matrix.rid, 'linux')
        run: |
          sudo apt-get install -y rpm zstd imagemagick

      - name: Publish AOT (Native AOT)
        shell: bash
        run: |
          dotnet publish AIShikikan.Gui.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishAot=true -p:PublishSingleFile=true -p:StripSymbols=true \
            -p:Version=${{ needs.check.outputs.version }} -o stage/aot

      - name: Publish regular dotnet (framework-dependent)
        shell: bash
        run: |
          dotnet publish AIShikikan.Gui.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained false \
            -p:PublishAot=false \
            -p:Version=${{ needs.check.outputs.version }} -o stage/dotnet

      - name: Publish self-contained (with .NET runtime)
        shell: bash
        run: |
          dotnet publish AIShikikan.Gui.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishAot=false -p:PublishSingleFile=true \
            -p:PublishTrimmed=true -p:TrimMode=partial \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=${{ needs.check.outputs.version }} -o stage/selfcontained

      - name: Build Linux packages (deb / rpm / pacman)
        if: startsWith(matrix.rid, 'linux')
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
          RID: ${{ matrix.rid }}
          HOMEPAGE: ${{ github.server_url }}/${{ github.repository }}
          MAINTAINER: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
        run: |
          set -euo pipefail
          case "$RID" in
            linux-x64)   DEB_ARCH=amd64;  PKG_ARCH=x86_64 ;;
            linux-arm64) DEB_ARCH=arm64;  PKG_ARCH=aarch64 ;;
            *) echo "unexpected rid $RID"; exit 1 ;;
          esac
          PKG=ai-shikikan
          # deb/rpm 的 Version 字段不允许 '-'
          PVER="${VERSION//-/_}"
          DESC="AI-Shikikan is an Agent commander: it orchestrates terminal agents such as Claude Code, OpenCode, Codex CLI and Gemini CLI to complete complex tasks."
          mkdir -p dist
          chmod +x stage/selfcontained/AIShikikan.Gui
          convert Assets/logo.jpg -resize 256x256 "$RUNNER_TEMP/ai-shikikan.png"

          # ---------- 公共的 desktop / 安装布局 (基于 selfcontained 单文件) ----------
          cat > "$RUNNER_TEMP/$PKG.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=AI-Shikikan
          GenericName=AI Agent Commander
          Comment=Commander for terminal AI agents
          Exec=$PKG
          Icon=$PKG
          Terminal=false
          Categories=Development;Utility;
          StartupWMClass=AIShikikan.Gui
          EOF

          # ---------- Debian (.deb) ----------
          ROOT="$PWD"
          DEBROOT="$RUNNER_TEMP/debroot"
          install -Dm755 stage/selfcontained/AIShikikan.Gui "$DEBROOT/usr/lib/$PKG/AIShikikan.Gui"
          mkdir -p "$DEBROOT/usr/bin"
          ln -sf "/usr/lib/$PKG/AIShikikan.Gui" "$DEBROOT/usr/bin/$PKG"
          install -Dm644 "$RUNNER_TEMP/$PKG.desktop" "$DEBROOT/usr/share/applications/$PKG.desktop"
          install -Dm644 "$RUNNER_TEMP/ai-shikikan.png" "$DEBROOT/usr/share/icons/hicolor/256x256/apps/$PKG.png"
          install -Dm644 LICENSE "$DEBROOT/usr/share/doc/$PKG/copyright"
          SIZE=$(du -sk "$DEBROOT" | cut -f1)
          mkdir -p "$DEBROOT/DEBIAN"
          cat > "$DEBROOT/DEBIAN/control" <<EOF
          Package: $PKG
          Version: $PVER
          Architecture: $DEB_ARCH
          Maintainer: $MAINTAINER
          Installed-Size: $SIZE
          Depends: libx11-6, libxcursor1, libxrandr2, libxrender1, libgl1, libglib2.0-0t64 | libglib2.0-0, libicu74 | libicu72 | libicu67 | libicu66
          Section: utils
          Priority: optional
          Homepage: $HOMEPAGE
          Description: AI Agent commander desktop app
           $DESC
          EOF
          dpkg-deb --build --root-owner-group "$DEBROOT" "dist/${PKG}_${PVER}_${DEB_ARCH}.deb"

          # ---------- Red Hat (.rpm) ----------
          mkdir -p "$HOME/rpmbuild"/{BUILD,RPMS,SPECS,SOURCES,SRPMS}
          cat > "$HOME/rpmbuild/SPECS/$PKG.spec" <<EOF
          %global debug_package %{nil}
          %undefine _missing_build_ids_terminate_build

          Name:     $PKG
          Version:  $PVER
          Release:  1
          Summary:  AI Agent commander desktop app
          License:  MIT
          URL:      $HOMEPAGE
          AutoReqProv: no

          %description
          $DESC

          %install
          rm -rf %{buildroot}
          install -Dm755 $ROOT/stage/selfcontained/AIShikikan.Gui %{buildroot}%{_prefix}/lib/$PKG/AIShikikan.Gui
          mkdir -p %{buildroot}%{_bindir}
          ln -sf %{_prefix}/lib/$PKG/AIShikikan.Gui %{buildroot}%{_bindir}/$PKG
          install -Dm644 $RUNNER_TEMP/$PKG.desktop %{buildroot}%{_datadir}/applications/$PKG.desktop
          install -Dm644 $RUNNER_TEMP/ai-shikikan.png %{buildroot}%{_datadir}/icons/hicolor/256x256/apps/$PKG.png
          install -Dm644 $ROOT/LICENSE %{buildroot}%{_docdir}/$PKG/LICENSE

          %files
          %{_prefix}/lib/$PKG
          %{_bindir}/$PKG
          %{_datadir}/applications/$PKG.desktop
          %{_datadir}/icons/hicolor/256x256/apps/$PKG.png
          %{_docdir}/$PKG
          EOF
          rpmbuild -bb --target "$PKG_ARCH" "$HOME/rpmbuild/SPECS/$PKG.spec"
          find "$HOME/rpmbuild/RPMS" -name "*.rpm" -exec cp -f {} dist/ \;

          # ---------- Arch Linux (.pkg.tar.zst) ----------
          PKGROOT="$RUNNER_TEMP/pkgroot"
          install -Dm755 stage/selfcontained/AIShikikan.Gui "$PKGROOT/usr/lib/$PKG/AIShikikan.Gui"
          mkdir -p "$PKGROOT/usr/bin"
          ln -sf "/usr/lib/$PKG/AIShikikan.Gui" "$PKGROOT/usr/bin/$PKG"
          install -Dm644 "$RUNNER_TEMP/$PKG.desktop" "$PKGROOT/usr/share/applications/$PKG.desktop"
          install -Dm644 "$RUNNER_TEMP/ai-shikikan.png" "$PKGROOT/usr/share/icons/hicolor/256x256/apps/$PKG.png"
          install -Dm644 LICENSE "$PKGROOT/usr/share/licenses/$PKG/LICENSE"
          PKGSIZE=$(du -sb "$PKGROOT" | cut -f1)
          cat > "$PKGROOT/.PKGINFO" <<EOF
          # Generated by release.yml
          pkgname = $PKG
          pkgver = $PVER-1
          pkgdesc = AI Agent commander desktop app
          url = $HOMEPAGE
          builddate = $(date +%s)
          packager = GitHub Actions
          size = $PKGSIZE
          arch = $PKG_ARCH
          license = MIT
          depend = libx11
          depend = libxcursor
          depend = libxrandr
          depend = libxrender
          depend = mesa
          depend = glib2
          depend = icu
          EOF
          tar --zstd -cf "dist/${PKG}-${PVER}-1-${PKG_ARCH}.pkg.tar.zst" \
            -C "$PKGROOT" .PKGINFO usr

          ls -lh dist/

      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          chmod +x stage/*/AIShikikan.Gui 2>/dev/null || true
          tar czf dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-AOT.tar.gz -C stage/aot .
          tar czf dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-dotnet.tar.gz -C stage/dotnet .
          tar czf dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-selfcontained.tar.gz -C stage/selfcontained .

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path stage/aot/* -DestinationPath dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-AOT.zip
          Compress-Archive -Path stage/dotnet/* -DestinationPath dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-dotnet.zip
          Compress-Archive -Path stage/selfcontained/* -DestinationPath dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-selfcontained.zip

      - name: Upload AOT artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.rid }}-AOT
          path: dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-AOT.*
          if-no-files-found: error

      - name: Upload dotnet artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.rid }}-dotnet
          path: dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-dotnet.*
          if-no-files-found: error

      - name: Upload selfcontained artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.rid }}-selfcontained
          path: dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-selfcontained.*
          if-no-files-found: error

      - name: Upload Linux packages (deb/rpm/pacman)
        if: startsWith(matrix.rid, 'linux')
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.rid }}-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [check, build]
    if: needs.check.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: false

      - name: List downloaded files
        run: find artifacts -type f | sort

      - name: Prepare release body from CHANGELOG
        run: |
          if [ -s CHANGELOG ]; then
            cp CHANGELOG release_body.md
          else
            echo "AI-Shikikan v${{ needs.check.outputs.version }} 发布" > release_body.md
            echo "::warning::CHANGELOG 为空, 使用默认发布说明"
          fi
          printf '\n包含三种构建版本 (每平台):\n- **AOT**: Native AOT 编译, 无需 .NET 运行时, 启动最快\n- **dotnet**: 常规发布, 需要安装 .NET 10 运行时\n- **selfcontained**: 自带 .NET 运行时, 开箱即用\n' >> release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: v${{ needs.check.outputs.version }}
          body_path: release_body.md
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
