# Release 发布工作流 (仅手动触发: Actions 页面 Run workflow)
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '覆盖版本号 (留空则读取根目录 VERSION 文件)'
        required: false
        default: ''
      prerelease:
        description: '标记为预发布 (Pre-release)'
        type: boolean
        default: false
      force:
        description: '强制重新构建 (即使 v<version> 标签已存在)'
        type: boolean
        default: false

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      run_build: ${{ steps.decide.outputs.run_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version from VERSION file
        id: read
        run: |
          FILE_VERSION="$(cat VERSION 2>/dev/null | tr -d '[:space:]')"
          if [ -z "$FILE_VERSION" ]; then
            FILE_VERSION="1.0.0-vibe"
            echo "::warning::VERSION file missing or empty, falling back to 1.0.0-vibe"
          fi
          if [ -z "${{ inputs.version }}" ]; then
            echo "version=${FILE_VERSION}" >> "$GITHUB_OUTPUT"
            echo "source=VERSION file" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "source=manual input" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to build
        id: decide
        run: |
          TAG="v${{ steps.read.outputs.version }}"
          if [ "${{ inputs.force }}" = "true" ]; then
            RUN=true; REASON="force input"
          elif git ls-remote --exit-code --tags origin "$TAG" > /dev/null 2>&1; then
            RUN=false; REASON="tag $TAG already exists"
          else
            RUN=true; REASON="tag $TAG not found"
          fi
          echo "run_build=${RUN}" >> "$GITHUB_OUTPUT"
          echo "reason=${REASON}" >> "$GITHUB_OUTPUT"
          {
            echo "## Version check"
            echo ""
            echo "- Version: \`${{ steps.read.outputs.version }}\` (from: ${{ steps.read.outputs.source }})"
            echo "- Tag: \`${TAG}\`"
            echo "- Build: **${RUN}** — ${REASON}"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.rid }}
    needs: check
    if: needs.check.outputs.run_build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            ext: tar.gz
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            ext: tar.gz
          - os: windows-latest
            rid: win-x64
            ext: zip
          - os: windows-11-vs2026-arm
            rid: win-arm64
            ext: zip
          - os: macos-15-intel
            rid: osx-x64
            ext: tar.gz
          - os: macos-15
            rid: osx-arm64
            ext: tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Install Linux AOT toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Install Linux packaging tools
        if: startsWith(matrix.rid, 'linux')
        run: |
          sudo apt-get install -y rpm zstd imagemagick

      - name: Publish AOT (Native AOT)
        shell: bash
        run: |
          dotnet publish AIShikikan.Gui.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishAot=true -p:PublishSingleFile=true -p:StripSymbols=true \
            -p:Version=${{ needs.check.outputs.version }} -o stage/aot

      - name: Publish regular dotnet (framework-dependent)
        shell: bash
        run: |
          dotnet publish AIShikikan.Gui.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained false \
            -p:PublishAot=false \
            -p:Version=${{ needs.check.outputs.version }} -o stage/dotnet

      - name: Publish self-contained (with .NET runtime)
        shell: bash
        run: |
          dotnet publish AIShikikan.Gui.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishAot=false -p:PublishSingleFile=true \
            -p:PublishTrimmed=true -p:TrimMode=partial \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=${{ needs.check.outputs.version }} -o stage/selfcontained

      - name: Build Linux packages (deb / rpm / pacman)
        if: startsWith(matrix.rid, 'linux')
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
          RID: ${{ matrix.rid }}
          HOMEPAGE: ${{ github.server_url }}/${{ github.repository }}
          MAINTAINER: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
        run: |
          set -euo pipefail
          case "$RID" in
            linux-x64)   DEB_ARCH=amd64;  PKG_ARCH=x86_64 ;;
            linux-arm64) DEB_ARCH=arm64;  PKG_ARCH=aarch64 ;;
            *) echo "unexpected rid $RID"; exit 1 ;;
          esac
          PKG=ai-shikikan
          # deb: Debian Version 只允许 [0-9A-Za-z.+~-], 下划线非法;
          #      '-' -> '~' 是预发布惯例, 保证 0.9.0~vibe 排序在 0.9.0 之前
          # 注意: bash 会把替换串里的裸 '~' 做 tilde 展开成 $HOME, 需转义成 '\~'
          DEB_VER="${VERSION//-/\~}"
          # rpm/pacman: Version 允许下划线 ('-' 才是分隔符), 用 '_' 替换 '-'
          PVER="${VERSION//-/_}"
          # 防御性校验: 任何异常的展开都会在此暴露实值, 而非 dpkg 的晦涩报错
          [[ "$DEB_VER" =~ ^[0-9A-Za-z.+~:-]+$ ]] || { echo "非法 DEB_VER='$DEB_VER' (VERSION='$VERSION')"; exit 1; }
          [[ "$PVER" =~ ^[0-9A-Za-z._+]+$ ]] || { echo "非法 PVER='$PVER' (VERSION='$VERSION')"; exit 1; }
          DESC="AI-Shikikan is an Agent commander: it orchestrates terminal agents such as Claude Code, OpenCode, Codex CLI and Gemini CLI to complete complex tasks."
          mkdir -p dist
          convert Assets/logo.jpg -resize 256x256 "$RUNNER_TEMP/ai-shikikan.png"
          cp packagers/ai-shikikan.desktop "$RUNNER_TEMP/$PKG.desktop"
          ROOT="$PWD"

          # 变体集合: 发布流程恒构建全部三种变体
          VARIANTS="dotnet selfcontained aot"
          # 三种变体的发布布局不同, 必须分支安装到 <root>/usr/lib/$PKG:
          #   dotnet         框架依赖「多文件」布局 —— apphost + AIShikikan.Gui.dll
          #                  + 69 个依赖 DLL + .deps.json + .runtimeconfig.json
          #                  + 卫星资源目录 en/。只拷 apphost 与 *.so 会装出
          #                  根本无法启动的包 (实测 77 个文件只装进 3 个, 运行报
          #                  "The application to execute does not exist:
          #                  .../AIShikikan.Gui.dll"), 故整目录安装。
          #   aot / selfcontained
          #                  单文件布局, 只需 apphost + 同目录原生共享库,
          #                  但仍须带卫星资源目录 (en/AIShikikan.Gui.resources.dll
          #                  是英文语言包, 非内嵌; 缺失只会回退为中文, 不崩溃)。
          # 两种布局都排除 *.pdb 调试符号。
          install_app_tree() {
            _tree_root="$1" _tree_src="$2"
            mkdir -p "$_tree_root/usr/lib/$PKG"
            if [ "$VARIANT" = "dotnet" ]; then
              cp -a "$_tree_src/." "$_tree_root/usr/lib/$PKG/"
              find "$_tree_root/usr/lib/$PKG" -name '*.pdb' -delete
            else
              install -m 755 "$_tree_src/AIShikikan.Gui" "$_tree_root/usr/lib/$PKG/AIShikikan.Gui"
              # 原生共享库 (libSkiaSharp/libHarfBuzzSharp 等) 必须与可执行文件同目录:
              # 运行时 dlopen 动态引用按 应用目录 -> 系统库路径 探测; selfcontained 因
              # IncludeNativeLibrariesForSelfExtract 已内嵌, glob 为空自动跳过
              for _so in "$_tree_src"/*.so; do
                [ -e "$_so" ] || continue
                install -m 755 "$_so" "$_tree_root/usr/lib/$PKG/"
              done
              # 卫星资源目录必须随包分发: en/AIShikikan.Gui.resources.dll 是英文
              # 语言包(Strings.en.resx), 并未内嵌进单文件。缺失不崩溃, 但界面会
              # 静默回退为中文。目录名以实际产物为准, 不硬编码。
              for _dir in "$_tree_src"/*/; do
                [ -d "$_dir" ] || continue
                cp -a "$_dir" "$_tree_root/usr/lib/$PKG/"
              done
            fi
          }

          for VARIANT in $VARIANTS; do
          echo "== 打包变体 $VARIANT =="
          case "$VARIANT" in
            dotnet)        BIN="$ROOT/stage/dotnet/AIShikikan.Gui" ;;
            selfcontained) BIN="$ROOT/stage/selfcontained/AIShikikan.Gui" ;;
            aot)           BIN="$ROOT/stage/aot/AIShikikan.Gui" ;;
          esac
          [ -f "$BIN" ] || { echo "缺少二进制 $BIN"; exit 1; }
          chmod +x "$BIN"
          BINDIR=$(dirname "$BIN")

          # ---------- Debian (.deb) ----------
          DEBROOT="$RUNNER_TEMP/debroot_$VARIANT"
          install_app_tree "$DEBROOT" "$BINDIR"
          mkdir -p "$DEBROOT/usr/bin"
          ln -sf "/usr/lib/$PKG/AIShikikan.Gui" "$DEBROOT/usr/bin/$PKG"
          install -Dm644 "$RUNNER_TEMP/$PKG.desktop" "$DEBROOT/usr/share/applications/$PKG.desktop"
          install -Dm644 "$RUNNER_TEMP/ai-shikikan.png" "$DEBROOT/usr/share/icons/hicolor/256x256/apps/$PKG.png"
          install -Dm644 LICENSE "$DEBROOT/usr/share/doc/$PKG/copyright"
          SIZE=$(du -sk "$DEBROOT" | cut -f1)
          mkdir -p "$DEBROOT/DEBIAN"
          sed -e "s|@VERSION@|$DEB_VER|g" \
              -e "s|@ARCH@|$DEB_ARCH|g" \
              -e "s|@MAINTAINER@|$MAINTAINER|g" \
              -e "s|@SIZE@|$SIZE|g" \
              -e "s|@HOMEPAGE@|$HOMEPAGE|g" \
              -e "s|@DESC@|$DESC|g" \
              packagers/deb/control > "$DEBROOT/DEBIAN/control"
          # 二进制包的 DEBIAN/control 只允许 RFC822 字段, 不接受 '#' 注释行
          # (dpkg-deb 会报 "field name '#' must be followed by colon", 行号还指向
          # 上一个字段, 极具误导性)。模板里一旦加注释就在这里提前拦下。
          if grep -n '^[[:space:]]*#' "$DEBROOT/DEBIAN/control"; then
            echo "::error::packagers/deb/control 含注释行, 二进制包 control 不允许注释 (说明请写进 packagers/README.md)"
            exit 1
          fi
          # dpkg 要求 Description 多行字段以换行终止, 缺尾换行会报 missing final newline
          [ -z "$(tail -c1 "$DEBROOT/DEBIAN/control")" ] || printf '\n' >> "$DEBROOT/DEBIAN/control"
          # 框架依赖变体: .NET 运行时来自系统包 (最佳努力, 缺包不阻塞安装);
          # 合并进已有 Recommends, 避免 dpkg-deb "duplicate value" 报错
          if [ "$VARIANT" = "dotnet" ]; then
            if grep -q '^Recommends:' "$DEBROOT/DEBIAN/control"; then
              sed -i 's/^Recommends: \(.*\)$/Recommends: \1, dotnet-runtime-10.0/' "$DEBROOT/DEBIAN/control"
            else
              echo "Recommends: dotnet-runtime-10.0" >> "$DEBROOT/DEBIAN/control"
            fi
          fi
          dpkg-deb --build --root-owner-group "$DEBROOT" "dist/${PKG}_${DEB_VER}_${DEB_ARCH}_${VARIANT}.deb"

          # ---------- Red Hat (.rpm / dnf) ----------
          mkdir -p "$HOME/rpmbuild"/{BUILD,RPMS,SPECS,SOURCES,SRPMS}
          rm -rf "$HOME/rpmbuild"/RPMS/*
          sed -e "s|@VERSION@|$PVER|g" \
              -e "s|@HOMEPAGE@|$HOMEPAGE|g" \
              -e "s|@DESC@|$DESC|g" \
              -e "s|@BIN@|$BIN|g" \
              -e "s|@BINDIR@|$BINDIR|g" \
              -e "s|@VARIANT@|$VARIANT|g" \
              -e "s|@DESKTOP@|$RUNNER_TEMP/$PKG.desktop|g" \
              -e "s|@ICON@|$RUNNER_TEMP/ai-shikikan.png|g" \
              -e "s|@LICENSE@|$ROOT/LICENSE|g" \
              packagers/rpm/ai-shikikan.spec > "$HOME/rpmbuild/SPECS/$PKG.spec"
          # 框架依赖变体: 声明系统 .NET 运行时 (rpm Recommends 不可满足仅告警)
          if [ "$VARIANT" = "dotnet" ]; then
            sed -i '/^AutoReqProv: no/a Recommends: dotnet-runtime-10.0' "$HOME/rpmbuild/SPECS/$PKG.spec"
          fi
          rpmbuild -bb --target "$PKG_ARCH" "$HOME/rpmbuild/SPECS/$PKG.spec"
          for _r in "$HOME"/rpmbuild/RPMS/*/*.rpm; do
            [ -e "$_r" ] || continue
            mv -f "$_r" "${_r%.rpm}_${VARIANT}.rpm"
            cp -f "${_r%.rpm}_${VARIANT}.rpm" dist/
          done

          # ---------- Arch Linux (.pkg.tar.zst) ----------
          PKGROOT="$RUNNER_TEMP/pkgroot_$VARIANT"
          install_app_tree "$PKGROOT" "$BINDIR"
          mkdir -p "$PKGROOT/usr/bin"
          ln -sf "/usr/lib/$PKG/AIShikikan.Gui" "$PKGROOT/usr/bin/$PKG"
          install -Dm644 "$RUNNER_TEMP/$PKG.desktop" "$PKGROOT/usr/share/applications/$PKG.desktop"
          install -Dm644 "$RUNNER_TEMP/ai-shikikan.png" "$PKGROOT/usr/share/icons/hicolor/256x256/apps/$PKG.png"
          install -Dm644 LICENSE "$PKGROOT/usr/share/licenses/$PKG/LICENSE"
          PKGSIZE=$(du -sb "$PKGROOT" | cut -f1)
          cat > "$PKGROOT/.PKGINFO" <<EOF
          # Generated by release.yml
          pkgname = $PKG
          pkgver = $PVER-1
          pkgdesc = AI Agent commander desktop app
          url = $HOMEPAGE
          builddate = $(date +%s)
          packager = GitHub Actions
          size = $PKGSIZE
          arch = $PKG_ARCH
          license = MIT
          depend = libx11
          depend = libxcursor
          depend = libxrandr
          depend = libxrender
          depend = libxext
          depend = libxfixes
          depend = libxi
          depend = libice
          depend = libsm
          depend = libxkbcommon
          depend = libglvnd
          depend = mesa
          depend = fontconfig
          depend = glib2
          depend = icu
          EOF
          # 框架依赖变体: 声明系统 .NET 运行时 (optdependency)
          if [ "$VARIANT" = "dotnet" ]; then
            printf 'optdepend = dotnet-runtime: 框架依赖变体需要系统 .NET 10 运行时\n' >> "$PKGROOT/.PKGINFO"
          fi
          tar --zstd -cf "dist/${PKG}-${PVER}-1-${PKG_ARCH}_${VARIANT}.pkg.tar.zst" \
            -C "$PKGROOT" .PKGINFO usr
          done

          ls -lh dist/

      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          chmod +x stage/*/AIShikikan.Gui 2>/dev/null || true
          # 排除调试符号: AOT 变体的 AIShikikan.Gui.dbg 约占目录 62%,
          # 不排除会让 AOT 归档体积翻倍 (实测 73.4MB -> 47.5MB)
          tar czf dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-AOT.tar.gz --exclude='*.pdb' --exclude='*.dbg' -C stage/aot .
          tar czf dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-dotnet.tar.gz --exclude='*.pdb' --exclude='*.dbg' -C stage/dotnet .
          tar czf dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-selfcontained.tar.gz --exclude='*.pdb' --exclude='*.dbg' -C stage/selfcontained .

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          # 排除调试符号 (*.pdb / *.dbg), 与 build.sh 打包口径一致。
          # Compress-Archive 不支持 -Exclude, 这里先把 stage 里的符号文件清掉
          # (Windows 产物中 AOT 原生 pdb 与常规 pdb 体积可观)
          Get-ChildItem -Path stage -Recurse -File |
            Where-Object { $_.Name -like '*.pdb' -or $_.Name -like '*.dbg' } |
            Remove-Item -Force
          Compress-Archive -Path stage/aot/* -DestinationPath dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-AOT.zip
          Compress-Archive -Path stage/dotnet/* -DestinationPath dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-dotnet.zip
          Compress-Archive -Path stage/selfcontained/* -DestinationPath dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-selfcontained.zip

      - name: Upload AOT artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.rid }}-AOT
          path: dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-AOT.*
          if-no-files-found: error

      - name: Upload dotnet artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.rid }}-dotnet
          path: dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-dotnet.*
          if-no-files-found: error

      - name: Upload selfcontained artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.rid }}-selfcontained
          path: dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-selfcontained.*
          if-no-files-found: error

      - name: Upload Linux packages (deb/rpm/pacman)
        if: startsWith(matrix.rid, 'linux')
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.rid }}-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [check, build]
    if: needs.check.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ needs.check.outputs.version }}"
          # force 重推保护: 改写一个已发布 Release 的 tag 是对外可见且
          # 不可逆的破坏性操作, 这里显式失败而不是静默 git tag -f + push --force。
          if [ "${{ inputs.force }}" = "true" ]; then
            EXISTING_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id' 2>/dev/null || true)"
            if [ -n "${EXISTING_ID:-}" ]; then
              echo "::error::已存在已发布的 Release (id=${EXISTING_ID}, tag=${TAG}); 拒绝在 force 模式下改写已发布版本的 tag。请先递增根目录 VERSION 后重试, 或手动删除该 Release 后再 force。"
              exit 1
            fi
            echo "force 模式: 未发现已发布的 Release (tag=${TAG}), 允许创建"
          fi
          # 先把 tag 推送到远端, 避免 softprops 自动创建 tag 时的竞态 (曾触发 GitHub 500)
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded files
        run: find artifacts -type f | sort

      # 产物完整性校验: 一次性列出本次 Release 全部资产 (归档 + 系统包) 的
      # sha256, 供下游分发方校验, 也便于事后核对某次发布的文件是否被改动。
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          ( cd artifacts && find . -type f ! -name SHA256SUMS -printf '%P\n' \
              | sort | xargs -r sha256sum > SHA256SUMS )
          echo "--- SHA256SUMS ($(wc -l < artifacts/SHA256SUMS) 项) ---"
          head -5 artifacts/SHA256SUMS

      - name: Prepare release body from CHANGELOG
        run: |
          # CHANGELOG.md 整体作为 Release 正文 —— 它本身就是按版本倒序排列的完整
          # 变更记录, GitHub 会渲染其中的标题层级, 读者可自行跳到关心的版本。
          # 缺失即中止: 静默降级成一句"发布"会让每次 Release 的说明都空洞无物。
          if [ ! -s CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md 缺失或为空, 无法生成发布说明"
            exit 1
          fi
          cp CHANGELOG.md release_body.md
          printf '\n包含三种构建版本 (每平台):\n- **AOT**: Native AOT 编译, 无需 .NET 运行时, 启动最快\n- **dotnet**: 常规发布, 需要安装 .NET 10 运行时\n- **selfcontained**: 自带 .NET 运行时, 开箱即用\n\nLinux 系统包 (deb/rpm/pacman):\n- **.deb**: Debian / Ubuntu\n- **.rpm**: Fedora / RHEL / dnf 系\n- **.pkg.tar.zst**: Arch Linux / Manjaro\n' >> release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release_body.md
          # 恒为正式发布(非草稿)。草稿对外不可见, 出问题时排查者看不到已失败的发布,
          # 而本工作流在最后才创建 Release —— 草稿模式下"跑成功了但 Release 不存在"
          # 会让人误以为没发布。失败要靠 job 状态与日志暴露, 而不是靠草稿藏起来。
          draft: false
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            artifacts/*
