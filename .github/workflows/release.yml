name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '覆盖版本号 (留空则读取根目录 VERSION 文件)'
        required: false
        default: ''
      prerelease:
        description: '标记为预发布 (Pre-release)'
        type: boolean
        default: false
      draft:
        description: '先创建为草稿 (Draft)'
        type: boolean
        default: false
      force:
        description: '强制重新构建 (即使 v<version> 标签已存在)'
        type: boolean
        default: false

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      run_build: ${{ steps.decide.outputs.run_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from VERSION file
        id: read
        run: |
          FILE_VERSION="$(cat VERSION 2>/dev/null | tr -d '[:space:]')"
          if [ -z "$FILE_VERSION" ]; then
            FILE_VERSION="0.9.0"
            echo "::warning::VERSION file missing or empty, falling back to 0.9.0"
          fi
          if [ -z "${{ inputs.version }}" ]; then
            echo "version=${FILE_VERSION}" >> "$GITHUB_OUTPUT"
            echo "source=VERSION file" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "source=manual input" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to build
        id: decide
        run: |
          TAG="v${{ steps.read.outputs.version }}"
          if [ "${{ inputs.force }}" = "true" ]; then
            RUN=true; REASON="force input"
          elif git ls-remote --exit-code --tags origin "$TAG" > /dev/null 2>&1; then
            RUN=false; REASON="tag $TAG already exists"
          else
            RUN=true; REASON="tag $TAG not found"
          fi
          echo "run_build=${RUN}" >> "$GITHUB_OUTPUT"
          echo "reason=${REASON}" >> "$GITHUB_OUTPUT"
          {
            echo "## Version check"
            echo ""
            echo "- Version: \`${{ steps.read.outputs.version }}\` (from: ${{ steps.read.outputs.source }})"
            echo "- Tag: \`${TAG}\`"
            echo "- Build: **${RUN}** — ${REASON}"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.rid }}
    needs: check
    if: needs.check.outputs.run_build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            ext: tar.gz
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            ext: tar.gz
          - os: windows-latest
            rid: win-x64
            ext: zip
          - os: macos-15-intel
            rid: osx-x64
            ext: tar.gz
          - os: macos-15
            rid: osx-arm64
            ext: tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Install Linux AOT toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish AOT (Native AOT)
        shell: bash
        run: |
          dotnet publish src/AIShikikan.Gui/AIShikikan.Gui.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishAot=true -p:PublishSingleFile=true -p:StripSymbols=true \
            -p:Version=${{ needs.check.outputs.version }} -o stage/aot

      - name: Publish regular dotnet (framework-dependent)
        shell: bash
        run: |
          dotnet publish src/AIShikikan.Gui/AIShikikan.Gui.csproj \
            -c Release -r ${{ matrix.rid }} \
            -p:PublishAot=false \
            -p:Version=${{ needs.check.outputs.version }} -o stage/dotnet

      - name: Publish self-contained (with .NET runtime)
        shell: bash
        run: |
          dotnet publish src/AIShikikan.Gui/AIShikikan.Gui.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishAot=false -p:PublishSingleFile=true \
            -p:PublishTrimmed=true -p:TrimMode=partial \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=${{ needs.check.outputs.version }} -o stage/selfcontained

      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          chmod +x stage/*/AIShikikan.Gui 2>/dev/null || true
          tar czf dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-AOT.tar.gz -C stage/aot .
          tar czf dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-dotnet.tar.gz -C stage/dotnet .
          tar czf dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-selfcontained.tar.gz -C stage/selfcontained .

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path stage/aot/* -DestinationPath dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-AOT.zip
          Compress-Archive -Path stage/dotnet/* -DestinationPath dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-dotnet.zip
          Compress-Archive -Path stage/selfcontained/* -DestinationPath dist/AIShikikan-${{ needs.check.outputs.version }}-${{ matrix.rid }}-selfcontained.zip

      - name: Upload to build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [check, build]
    if: needs.check.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: List downloaded files
        run: find artifacts -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: v${{ needs.check.outputs.version }}
          body: |
            AI-Shikikan v${{ needs.check.outputs.version }} 发布

            包含三种构建版本 (每平台):
            - **AOT**: Native AOT 编译, 无需 .NET 运行时, 启动最快
            - **dotnet**: 常规发布, 需要安装 .NET 10 运行时
            - **selfcontained**: 自带 .NET 运行时, 开箱即用
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
