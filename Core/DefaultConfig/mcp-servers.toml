# MCP 服务器配置示例(stdio 传输)
# 每个服务器以 [[servers]] 表定义, 字段:
#   id      - 唯一标识(小写字母/数字/连字符), 用于工具名前缀 mcp_<id>_
#   name    - 显示名称
#   command - 启动命令(npx / uvx / node / python 等)
#   args    - 命令参数数组
#   env     - 额外环境变量表(可选, 与父进程环境合并)
#   enabled - 是否启用(默认 true)

[[servers]]
id = "filesystem"
name = "文件系统"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "/home/user/docs"]
enabled = false

[[servers]]
id = "fetch"
name = "网页抓取"
command = "uvx"
args = ["mcp-server-fetch"]
enabled = false
