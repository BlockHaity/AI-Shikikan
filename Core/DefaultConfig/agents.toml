# Agent 程序默认配置(首次启动自动生成)
# 参数通过 args 模板传入, 支持 {prompt} 占位符
# plan_args 为 Plan 模式附加参数(主对话 Plan 模式且该子代理被允许时追加)
# 可自由修改或删除任意条目

rules = "优先选择专长与任务匹配的 Agent; 涉及多个领域时先拆分子任务再分配。"

[[agents]]
id = "claude"
name = "Claude Code"
executable = "claude"
args = ["-p", "{prompt}"]
plan_args = ["--permission-mode", "plan"]
default_mode = "sync"
max_concurrent = 1
require_approval = true
timeout_minutes = 30
description = "Anthropic 官方编码 Agent, 擅长代码实现/重构/测试"
recommended_persona_id = "general-expert"

[[agents]]
id = "codex"
name = "Codex CLI"
executable = "codex"
args = ["exec", "{prompt}"]
plan_args = ["--sandbox", "read-only", "--ask-for-approval", "never"]
default_mode = "sync"
max_concurrent = 1
require_approval = true
timeout_minutes = 30
description = "OpenAI 官方 CLI 编码 Agent, 擅长精确的小步修改"
recommended_persona_id = "general-expert"

[[agents]]
id = "gemini"
name = "Gemini CLI"
executable = "gemini"
args = ["-p", "{prompt}"]
plan_args = ["--approval-mode", "plan"]
default_mode = "sync"
max_concurrent = 1
require_approval = true
timeout_minutes = 30
description = "Google 官方命令行 Agent, 支持联网与多模态, 适合研究与搜索"

[[agents]]
id = "opencode"
name = "OpenCode"
executable = "opencode"
args = ["run", "{prompt}"]
plan_args = ["--mode", "plan"]
default_mode = "sync"
max_concurrent = 1
require_approval = true
timeout_minutes = 30
description = "开源通用命令行 Agent, 插件生态丰富"

[[agents]]
id = "dsh"
name = "DeepSeek Harness"
executable = "dsh"
args = ["--profile", "headless", "{prompt}"]
default_mode = "sync"
max_concurrent = 1
require_approval = true
timeout_minutes = 30
description = "DeepSeek 官方开源 Agent Harness, 插件化运行时, 默认优先 DeepSeek 模型"
